name: Release

# Push a tag like `v0.1.0` (or `v0.1.0-beta.1` for a prerelease) to publish a release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

  build-cpu:
    name: Build quoteme (CPU)
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu
      - run: cargo build --locked --release --bin quoteme
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/quoteme.exe dist/
          cd dist && 7z a "quoteme-${GITHUB_REF_NAME}-windows-x86_64.zip" quoteme.exe && rm quoteme.exe
      - uses: actions/upload-artifact@v7
        with:
          name: quoteme-cpu
          path: dist/*.zip
          if-no-files-found: error

  # Compiling CUDA code only needs the toolkit (nvcc), not a GPU, so this runs
  # fine on a hosted runner. A GPU is only required to *run* the result.
  build-cuda:
    name: Build quoteme-cuda (CUDA)
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda
      - name: Install CUDA Toolkit
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.2.0" # first release that supports the VS 2026 toolchain on the runner
          method: network
      # The VS generator can't find the CUDA MSBuild integration on hosted runners,
      # so use Ninja + cl.exe, which only need nvcc.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        env:
          CMAKE_GENERATOR: Ninja
        run: cargo build --locked --release --features cuda --bin quoteme-cuda
      - name: Package (bundle CUDA runtime DLLs)
        shell: bash
        run: |
          mkdir -p dist/stage
          cp target/release/quoteme-cuda.exe dist/stage/
          cuda_bin="$(cygpath -u "$CUDA_PATH")/bin"
          # CUDA 13 keeps DLLs in bin/x64; older toolkits use bin/ directly.
          for dll in cudart64 cublas64 cublasLt64; do
            find "$cuda_bin" -name "${dll}_*.dll" -exec cp {} dist/stage/ \;
          done
          ls dist/stage
          cd dist/stage && 7z a "../quoteme-cuda-${GITHUB_REF_NAME}-windows-x86_64.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: quoteme-cuda
          path: dist/*.zip
          if-no-files-found: error

  fetch-model:
    name: Fetch Whisper model
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify ggml-medium.en-q5_0.bin
        run: |
          curl -fL --retry 3 -o ggml-medium.en-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.en-q5_0.bin
          echo "76733e26ad8fe1c7a5bf7531a9d41917b2adc0f20f2e4f5531688a8c6cd88eb0  ggml-medium.en-q5_0.bin" | sha256sum -c -
      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: ggml-medium.en-q5_0.bin
          if-no-files-found: error

  publish:
    name: Checksum & publish release
    needs: [build-cpu, build-cuda, fetch-model]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum *.zip ggml-medium.en-q5_0.bin | tee SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes $flags \
            --notes "Verify downloads with \`SHA256SUMS\`: PowerShell \`Get-FileHash <file> -Algorithm SHA256\`, or \`sha256sum -c SHA256SUMS\`. The CUDA build needs an NVIDIA GPU and driver; CUDA runtime DLLs are bundled in its zip. ggml-medium.en-q5_0.bin is a Whisper model (other models: https://huggingface.co/ggerganov/whisper.cpp) - see the README for setup."
