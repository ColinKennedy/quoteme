[package]
name = "quoteme"
version = "0.1.0"
edition = "2021"
description = "Minimal Whisper-based speech-to-text transcription CLI for Windows"

[[bin]]
name = "quoteme"
path = "src/main.rs"

# CUDA build — same source, compiled with GPU support.
# Build with: cargo build --release --features cuda --bin quoteme-cuda
# Requires NVIDIA GPU + CUDA Toolkit 12.x installed.
[[bin]]
name = "quoteme-cuda"
path = "src/main.rs"
required-features = ["cuda"]

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
dirs = "5"
enigo = "0.1"
hound = "3.5"
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[features]
# Enable NVIDIA GPU acceleration (requires CUDA Toolkit 12.x).
# Used automatically when building the `quoteme-cuda` binary.
cuda = ["whisper-rs/cuda"]

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# whisper-rs-sys 0.9.0 defaults to CUDA arch 52;61;70, but compute_70 was
# dropped in CUDA 13.x. This local patch overrides GGML_CUDA_ARCHITECTURES
# to target Turing (75) and newer only.
whisper-rs-sys = { path = "vendor/whisper-rs-sys-0.9.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
