[package]
name = "quoteme"
version = "0.1.0"
edition = "2021"
description = "Minimal Whisper-based speech-to-text transcription CLI for Windows"

[[bin]]
name = "quoteme"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
dirs = "5"
enigo = "0.1"
hound = "3.5"
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
